# Broker MQTT SEJENAK (Eclipse Mosquitto 2.x), di-hosting di dalam negeri.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Perangkat Dok Sejenak: MQTT over TLS
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# Aplikasi PWA: MQTT over WebSocket aman
listener 8884
protocol websockets
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# Tidak menyimpan pesan lama: data peristiwa hanya lewat, disimpan oleh backend
persistence false
log_type error
log_type warning
