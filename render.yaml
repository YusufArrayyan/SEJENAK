# Render Blueprint untuk SEJENAK
# Render > New > Blueprint > pilih repo YusufArrayyan/SEJENAK. Render membaca berkas ini otomatis.
services:
  - type: web
    name: sejenak
    runtime: static
    rootDir: app
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    buildFilter:
      paths:
        - app/**
    # Aplikasi satu halaman: semua rute (/teman, /saya/dok, dst.) dilayani index.html.
    # Render tidak menerapkan rewrite pada berkas yang ada (JS, CSS, ikon, sw.js).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Service worker dan manifest selalu dicek ulang agar pembaruan PWA cepat sampai
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Aset ber-hash dari Vite aman disimpan lama
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Keamanan (PRD: tanpa pelacak pihak ketiga)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' wss: ws:; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'"
